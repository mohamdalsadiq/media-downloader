name: media_downloader
description: "تنزيل فيديوهات وملفات الميديا من منصات التواصل عبر زر المشاركة."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # استقبال الروابط من زر المشاركة بالنظام
  receive_sharing_intent: ^1.8.0

  # فتح الروابط في المتصفح (متصفطلب فقط لبعض المنصات)
  url_launcher: ^6.2.5

  # مسار التخزين على الجهاز
  path_provider: ^2.1.2

  # صلاحيات التشغيل (الإشعارات + التخزين)
  permission_handler: ^11.2.0

  # تنزيل الملفات المباشرة (v2) + قياس تقدم التنزيل
  http: ^1.2.0

  # فحص اتصال الإنترنت قبل البدء
  connectivity_plus: ^5.0.2

  # تخزين الإعدادات (رابط الـ API المخصّص) محلياً
  shared_preferences: ^2.2.2

  # أيقونات iOS-style احتياطية
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  generate: true
